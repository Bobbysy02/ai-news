name: Daily AI News Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  # 开启需要真实浏览器的源（小黑盒）。本机不设这个变量，所以本地完全不用装 Playwright
  ENABLE_PLAYWRIGHT: '1'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements-ci.txt

      - name: 确认浏览器
        run: |
          # ubuntu-latest 自带 Google Chrome，Playwright 直接驱动即可，无需下载 Chromium
          which google-chrome || which google-chrome-stable || echo "未找到 Chrome，小黑盒源会自动跳过"

      - name: 抓取新闻
        run: python fetch_news.py

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js history.json
          git commit -m "每日更新 $(date +%Y-%m-%d)" || echo "数据无变化，跳过提交"
          git push
