name: Daily AI News Update

on:
  schedule:
    # 故意避开整点：官方文档说明整点是 Actions 高负载时段，
    # 排队会延迟（实测 08:00 的整点任务 08:56 才开跑），负载过高时甚至直接丢弃。
    # 往后挪 17 分钟，延迟和被丢的概率都明显下降。北京时间 08:17 触发。
    - cron: '17 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  # 开启需要真实浏览器的源（小黑盒）。本机不设这个变量，所以本地完全不用装 Playwright
  ENABLE_PLAYWRIGHT: '1'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements-ci.txt

      - name: 确认浏览器
        run: |
          # ubuntu-latest 自带 Google Chrome，Playwright 直接驱动即可，无需下载 Chromium
          which google-chrome || which google-chrome-stable || echo "未找到 Chrome，小黑盒源会自动跳过"

      - name: 抓取新闻
        # 跨境抓取偶发抖动（连接重置、个别站点临时不可达）时自动重试一次。
        # 第二次仍失败才让 job 变红；脚本中途失败不会写 data.js，
        # 线上会继续显示前一天的完整数据，不会白屏。
        run: |
          python fetch_news.py || {
            echo "::warning::首次抓取失败，5 秒后重试一次"
            sleep 5
            python fetch_news.py
          }

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js history.json
          git commit -m "每日更新 $(date +%Y-%m-%d)" || echo "数据无变化，跳过提交"
          git push
